<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PartnerHub</title><style>
body{font-family:Arial;margin:0;background:#f4f6fa;color:#172033}.wrap{max-width:900px;margin:auto;background:white;min-height:100vh;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:800}.tabs button,.btn{padding:10px 14px;border:0;border-radius:9px;margin:4px;background:#172033;color:white}.card{padding:18px;border:1px solid #e3e6ed;border-radius:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3df;border-radius:8px;box-sizing:border-box}.muted{color:#667085}.score{font-size:20px;font-weight:bold}.hide{display:none}</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">PartnerHub</div><div class="muted">Find the Right Partner. Build Together.</div></div><button class="btn" onclick="logout()">Logout</button></div>
<div id="auth" class="card"><h2>Login / Register</h2><input id="name" placeholder="Name (registration)"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (8+ chars)"><select id="role"><option value="partner">Partner / Investor</option><option value="owner">Business Owner</option></select><input id="city" placeholder="City"><input id="skills" placeholder="Skills, comma separated"><input id="investment" type="number" placeholder="Investment capacity ₹"><input id="interests" placeholder="Business interests, comma separated"><button class="btn" onclick="register()">Create account</button><button class="btn" onclick="login()">Login</button><p id="msg"></p></div>
<div id="app" class="hide"><div class="tabs"><button onclick="loadBusinesses()">Find Business</button><button onclick="showPost()">Post Business</button><button onclick="loadMatches()">My Matches</button><button onclick="loadNotifs()">Notifications</button><button onclick="profile()">Profile</button></div><div id="content"></div></div></div>
<script>
let T=localStorage.getItem('ph_token'); if(T){document.getElementById('auth').classList.add('hide');document.getElementById('app').classList.remove('hide');loadBusinesses()}
const api=async(u,o={})=>{o.headers={...(o.headers||{}),'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.detail||'Error');return d}
function fail(e){document.getElementById('msg').textContent=e.message}
async function register(){try{let d=await api('/api/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:pass.value,role:role.value,city:city.value,skills:skills.value,investment:+investment.value||0,interests:interests.value})});T=d.token;localStorage.ph_token=T;location.reload()}catch(e){fail(e)}}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});T=d.token;localStorage.ph_token=T;location.reload()}catch(e){fail(e)}}
function logout(){localStorage.removeItem('ph_token');location.reload()}
async function loadBusinesses(){let d=await api('/api/businesses');content.innerHTML='<h2>Business Opportunities</h2>'+d.map(b=>`<div class="card"><h3>${b.name}</h3><p>${b.description||''}</p><span class="muted">${b.category} • ${b.city} • Partner investment ₹${b.partner_investment}</span><p class="score">${b.match_score}% Match</p><button class="btn" onclick="interest(${b.id})">I'm Interested</button></div>`).join('')||'<p>No listings yet.</p>'}
async function interest(id){await api('/api/interests',{method:'POST',body:JSON.stringify({business_id:id})});alert('Interest sent!');loadBusinesses()}
function showPost(){content.innerHTML=`<h2>Post Business</h2><input id="bn" placeholder="Business name"><input id="bc" placeholder="Category"><input id="bl" placeholder="City"><input id="ir" type="number" placeholder="Total investment required"><input id="pi" type="number" placeholder="Partner investment"><input id="pp" type="number" placeholder="Partnership %"><input id="ps" type="number" placeholder="Profit share %"><textarea id="bd" placeholder="Description"></textarea><button class="btn" onclick="postBiz()">Publish</button>`}
async function postBiz(){try{await api('/api/businesses',{method:'POST',body:JSON.stringify({name:bn.value,category:bc.value,city:bl.value,investment_required:+ir.value||0,partner_investment:+pi.value||0,partnership_pct:+pp.value||0,profit_share:+ps.value||0,description:bd.value})});alert('Published');loadBusinesses()}catch(e){alert(e.message)}}
async function loadMatches(){let d=await api('/api/matches');content.innerHTML='<h2>My Matches</h2>'+d.map(x=>`<div class="card"><b>${x.name}</b><p>${x.category} • ${x.city}</p><span>Status: ${x.status}</span></div>`).join('')||'<p>No matches yet.</p>'}
async function loadNotifs(){let d=await api('/api/notifications');content.innerHTML='<h2>Notifications</h2>'+d.map(x=>`<div class="card">${x.text}<div class="muted">${x.created_at}</div></div>`).join('')||'<p>No notifications.</p>'}
async function profile(){let u=await api('/api/me');content.innerHTML=`<h2>My Profile</h2><div class="card"><b>${u.name}</b><p>${u.city||''}</p><p>Skills: ${u.skills||'—'}</p><p>Investment: ₹${u.investment||0}</p><p>Interests: ${u.interests||'—'}</p><p>Verification: ${u.verified?'Verified':'Pending'}</p></div>`}
</script></body></html>
