<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartnerHub India</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6fa;
  color:#172033;
}
.wrap{
  max-width:900px;
  margin:auto;
  background:white;
  min-height:100vh;
  padding:24px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.brand{
  font-size:30px;
  font-weight:800;
}
.tag{
  color:#667085;
  font-size:17px;
  margin-top:4px;
}
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:20px 0;
}
button,.btn{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:#172033;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover,.btn:hover{
  opacity:.9;
}
.card{
  padding:18px;
  border:1px solid #e3e6ed;
  border-radius:14px;
  margin:12px 0;
  background:#fff;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccd3df;
  border-radius:9px;
  font-size:16px;
}
textarea{
  min-height:100px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.muted{
  color:#667085;
}
.score{
  font-size:20px;
  font-weight:bold;
}
.hide{
  display:none!important;
}
.error{
  color:#c62828;
  margin-top:10px;
}
.success{
  color:#16803c;
  margin-top:10px;
}
.lang{
  width:auto;
  padding:9px;
  margin:0;
}
h2{
  margin-top:8px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      <div class="brand">PartnerHub India</div>
      <div class="tag" id="tagline">
        Find the Right Partner. Build Together.
      </div>
    </div>

    <div>
      <select id="language" class="lang" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>

      <button class="btn" onclick="logout()" id="logoutBtn">
        Logout
      </button>
    </div>

  </div>


  <!-- LOGIN / REGISTER -->

  <div id="auth" class="card">

    <h2 id="authTitle">Login / Register</h2>

    <input
      id="name"
      placeholder="Name"
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="pass"
      type="password"
      placeholder="Password (8+ characters)"
    >

    <select id="role">
      <option value="partner">Partner / Investor</option>
      <option value="owner">Business Owner</option>
    </select>

    <input
      id="city"
      placeholder="City"
    >

    <input
      id="skills"
      placeholder="Skills, comma separated"
    >

    <input
      id="investment"
      type="number"
      placeholder="Investment capacity ₹"
    >

    <input
      id="interests"
      placeholder="Business interests, comma separated"
    >

    <div>
      <button class="btn" onclick="register()" id="registerBtn">
        Create Account
      </button>

      <button class="btn" onclick="login()" id="loginBtn">
        Login
      </button>
    </div>

    <p id="msg"></p>

  </div>


  <!-- APP -->

  <div id="app" class="hide">

    <div class="tabs">

      <button onclick="loadBusinesses()">
        Find Business
      </button>

      <button onclick="showPost()">
        Post Business
      </button>

      <button onclick="loadMatches()">
        My Matches
      </button>

      <button onclick="loadNotifs()">
        Notifications
      </button>

      <button onclick="profile()">
        Profile
      </button>

    </div>

    <div id="content"></div>

  </div>

</div>


<script>

/* =========================
   TOKEN
========================= */

let T = localStorage.getItem("ph_token");


/* =========================
   API
   IMPORTANT:
   API IS CREATED BEFORE
   loadBusinesses()
========================= */

const api = async (url, options = {}) => {

  options.headers = {
    ...(options.headers || {}),
    "Content-Type": "application/json"
  };

  if (T) {
    options.headers.Authorization = "Bearer " + T;
  }

  let response;

  try {
    response = await fetch(url, options);
  } catch (error) {
    throw new Error("Server connection failed");
  }

  let data;

  try {
    data = await response.json();
  } catch (error) {
    throw new Error("Invalid server response");
  }

  if (!response.ok) {

    if (typeof data.detail === "string") {
      throw new Error(data.detail);
    }

    throw new Error(
      JSON.stringify(data.detail || data)
    );
  }

  return data;
};


/* =========================
   START APP
========================= */

if (T) {

  document.getElementById("auth")
    .classList.add("hide");

  document.getElementById("app")
    .classList.remove("hide");

  loadBusinesses()
    .catch(function(error){

      if (
        error.message.includes("expired") ||
        error.message.includes("Invalid") ||
        error.message.includes("Login required")
      ) {
        localStorage.removeItem("ph_token");
        T = null;

        document.getElementById("auth")
          .classList.remove("hide");

        document.getElementById("app")
          .classList.add("hide");

        showMessage("Please login again.", true);
      }
      else {
        showMessage(error.message, true);
      }

    });

}
else {

  document.getElementById("auth")
    .classList.remove("hide");

  document.getElementById("app")
    .classList.add("hide");

}


/* =========================
   MESSAGE
========================= */

function showMessage(text, error = false){

  const msg = document.getElementById("msg");

  msg.textContent = text;

  msg.className = error
    ? "error"
    : "success";
}


/* =========================
   REGISTER
========================= */

async function register(){

  try {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("pass").value;

    const name =
      document.getElementById("name").value.trim();

    if (!name) {
      showMessage("Please enter your name.", true);
      return;
    }

    if (!email || !email.includes("@")) {
      showMessage("Please enter a valid email.", true);
      return;
    }

    if (password.length < 8) {
      showMessage(
        "Password must be at least 8 characters.",
        true
      );
      return;
    }

    const data = await api(
      "/api/register",
      {
        method:"POST",

        body:JSON.stringify({

          name:name,

          email:email,

          password:password,

          role:
            document.getElementById("role").value,

          city:
            document.getElementById("city").value,

          skills:
            document.getElementById("skills").value,

          investment:
            Number(
              document.getElementById("investment").value
            ) || 0,

          interests:
            document.getElementById("interests").value

        })
      }
    );

    T = data.token;

    localStorage.setItem(
      "ph_token",
      T
    );

    location.reload();

  }
  catch(error){

    showMessage(
      error.message,
      true
    );

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  try {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("pass").value;

    if (!email || !email.includes("@")) {

      showMessage(
        "Please enter a valid email.",
        true
      );

      return;
    }

    if (!password) {

      showMessage(
        "Please enter your password.",
        true
      );

      return;
    }

    const data = await api(
      "/api/login",
      {
        method:"POST",

        body:JSON.stringify({

          email:email,

          password:password

        })
      }
    );

    T = data.token;

    localStorage.setItem(
      "ph_token",
      T
    );

    location.reload();

  }
  catch(error){

    showMessage(
      error.message,
      true
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "ph_token"
  );

  T = null;

  location.reload();

}


/* =========================
   FIND BUSINESS
========================= */

async function loadBusinesses(){

  const content =
    document.getElementById("content");

  try {

    const businesses =
      await api("/api/businesses");

    if (!businesses.length) {

      content.innerHTML = `
        <div class="card">
          <h2>Business Opportunities</h2>
          <p class="muted">
            No business listings yet.
          </p>
        </div>
      `;

      return;
    }

    content.innerHTML = `
      <h2>Business Opportunities</h2>

      <div class="grid">

        ${businesses.map(function(b){

          return `

            <div class="card">

              <h3>${escapeHTML(b.name)}</h3>

              <p>
                ${escapeHTML(
                  b.description || ""
                )}
              </p>

              <p class="muted">
                ${escapeHTML(
                  b.category || "Other"
                )}
                •
                ${escapeHTML(
                  b.city || "India"
                )}
              </p>

              <p>
                Partner Investment:
                ₹${Number(
                  b.partner_investment || 0
                ).toLocaleString("en-IN")}
              </p>

              <p>
                Partnership:
                ${b.partnership_pct || 0}%
              </p>

              <p>
                Profit Share:
                ${b.profit_share || 0}%
              </p>

              <p class="score">
                ${b.match_score || 0}% Match
              </p>

              <button
                class="btn"
                onclick="interest(${b.id})"
              >
                I'm Interested
              </button>

            </div>

          `;

        }).join("")}

      </div>
    `;

  }
  catch(error){

    content.innerHTML = `
      <div class="card error">
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =========================
   INTEREST
========================= */

async function interest(id){

  try {

    await api(
      "/api/interests",
      {
        method:"POST",

        body:JSON.stringify({
          business_id:id
        })
      }
    );

    alert("Interest sent successfully!");

    loadBusinesses();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================
   POST BUSINESS
========================= */

function showPost(){

  document.getElementById("content").innerHTML = `

    <div class="card">

      <h2>Post Business</h2>

      <input
